[host]
# 15 bit hexadecimal number specifying the IPv6 subnet within the global prefix.
# In vast majority of cases, the default value of 0 (provided if this field is
# missing) is the best choice.
subnet = 0x0000
# The Ed25519 private key of this host in the raw format.
private_key_path = "/foo/bar"

[peers]
# z32-encoded Ed25519 keys of allowed peers.
alice = "ri5s1riaxztowkfasg645kdngnugembhsjwke5qfrktno9qjn8ty"
bob = "..."

[tun]
# Name of the OS-level TUN network interface. If missing or empty, the
# OS/driver picks a unique name automatically (e.g. "tun0" on Linux).
# name = "zeroconf-p2p-vpn"
# Human-readable interface description (Windows only). Defaults to a
# built-in description if missing.
# description = "zeroconf-p2p-vpn VPN interface"

[dns]
# If this section is present, peer names from [peers] above become resolvable
# as DNS names under this suffix, e.g. "alice.p2p". If missing entirely, DNS
# resolution of peer names is disabled.
# suffix = "p2p"

[discovery]
# Peer discovery settings. If this section is missing entirely, all three
# fields default to using the n0.computer relay plus mDNS and the DHT (the
# most permissive, "just works" configuration).
#
# One of "Full" (use the n0.computer relay), "DisableRelay" (use n0.computer
# only for discovery, not relaying) or "NoN0" (rely on mDNS/DHT only).
# n0_discovery = "Full"
# Discover peers on the local network via mDNS.
# use_mdns = true
# Discover peers via the BitTorrent-style DHT.
# use_dht = true
