# Static system user/group for zeroconf-p2p-vpn.service -- see that file for why this is a static
# account rather than DynamicUser=yes.
#
# Install as /etc/sysusers.d/zeroconf-p2p-vpn.conf, then run `systemd-sysusers` (or
# `systemd-sysusers zeroconf-p2p-vpn.conf` to apply just this file immediately without installing
# it first). Creates both the "zeroconf-p2p-vpn" user and a matching group of the same name; no
# home directory, no login shell, since this account only ever runs the one daemon.
#
# Type Name              ID  GECOS                           Home  Shell
u      zeroconf-p2p-vpn  -   "zeroconf-p2p-vpn VPN daemon"   -     /usr/sbin/nologin
