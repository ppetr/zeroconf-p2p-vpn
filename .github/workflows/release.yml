name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag v$tag_version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  build:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            cross_packages: mingw-w64
            suffix: ".exe"
            archive: zip
          - target: aarch64-unknown-linux-gnu
            cross_packages: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross"
            suffix: ""
            archive: tar.xz
          - target: armv7-unknown-linux-gnueabihf
            cross_packages: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross"
            suffix: ""
            archive: tar.xz
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.cross_packages }} \
            cmake protobuf-compiler libprotobuf-dev xz-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          name="zeroconf-p2p-vpn-v${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/zeroconf-p2p-vpn${{ matrix.suffix }}"
          mkdir -p dist
          cp "$bin" "zeroconf-p2p-vpn${{ matrix.suffix }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "dist/${name}.zip" "zeroconf-p2p-vpn${{ matrix.suffix }}"
          else
            tar cJf "dist/${name}.tar.xz" "zeroconf-p2p-vpn${{ matrix.suffix }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
