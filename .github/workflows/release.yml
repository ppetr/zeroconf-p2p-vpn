name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  check-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag v$tag_version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  build:
    needs: check-version
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            extra_packages: mingw-w64
            suffix: ".exe"
            archive: zip
            zigbuild: false
          - target: x86_64-unknown-linux-musl
            extra_packages: ""
            suffix: ""
            archive: tar.xz
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            extra_packages: ""
            suffix: ""
            archive: tar.xz
            zigbuild: true
          - target: armv7-unknown-linux-musleabihf
            extra_packages: ""
            suffix: ""
            archive: tar.xz
            zigbuild: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake protobuf-compiler libprotobuf-dev xz-utils zip \
            ${{ matrix.extra_packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The *-musl targets are statically linked (no GLIBC version dependency on
      # the host running the binary, unlike the previous *-gnu cross-builds).
      # zig cc provides the musl cross-toolchain; plain rustup+cargo build the
      # Windows target natively via the mingw-w64 cross-gcc installed above.
      - name: Install cargo-zigbuild and Zig
        if: matrix.zigbuild
        run: |
          pip install --break-system-packages ziglang
          cargo install cargo-zigbuild --locked

      - name: Build
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          name="zeroconf-p2p-vpn-v${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/zeroconf-p2p-vpn${{ matrix.suffix }}"
          mkdir -p dist
          cp "$bin" "zeroconf-p2p-vpn${{ matrix.suffix }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "dist/${name}.zip" "zeroconf-p2p-vpn${{ matrix.suffix }}"
          else
            tar cJf "dist/${name}.tar.xz" "zeroconf-p2p-vpn${{ matrix.suffix }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
